name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage
          POSTGRES_DB: triage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triage -d triage_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # Enables the Postgres contract tests and the migration check.
      TEST_DATABASE_URL: postgresql+psycopg://triage:triage@localhost:5432/triage_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src tests
      - name: Test
        run: uv run pytest
      - name: Audit dependencies for known vulnerabilities
        run: uv export --locked --no-dev --no-hashes --no-emit-project --format requirements-txt > requirements.txt && uvx pip-audit -r requirements.txt --disable-pip --no-deps

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t ai-alert-triage:ci .
